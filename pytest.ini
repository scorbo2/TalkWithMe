[pytest]
testpaths = tests
addopts = -q
# pytest-timeout (see requirements-dev.txt). Every test here is offline and the
# whole suite runs in a couple of seconds, so 30s per test is a deadlock
# detector, not a performance budget: a fake ASGI harness that spins forever
# fails by name instead of stalling the run with no output at all.
timeout = 30
